<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI NAS Manager — Scene Studio</title>
  <style>
    :root { color-scheme: dark; font-family: "Yu Gothic UI","Meiryo",system-ui,sans-serif; --bg:#070a0f; --panel:#0d131c; --raised:#121b27; --line:#263448; --text:#edf5ff; --muted:#91a0b4; --blue:#45bfff; --cyan:#55e7d0; --gold:#ffc857; }
    * { box-sizing: border-box; }
    body { margin:0; background:radial-gradient(circle at 28% 0%,#10253a 0,transparent 34%),var(--bg); color:var(--text); }
    button,input { color:inherit; font:inherit; }
    header { height:70px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; border-bottom:1px solid var(--line); background:#090e15e8; backdrop-filter:blur(14px); }
    .brand { display:flex; align-items:center; gap:12px; font-weight:750; letter-spacing:.02em; }
    .logo { width:38px; height:38px; display:grid; place-items:center; border-radius:11px; background:linear-gradient(145deg,#38d5ff,#315fea); box-shadow:0 0 26px #2aaaff55; font-size:13px; }
    .product { color:#7f90a6; font-weight:500; }
    .status { display:flex; align-items:center; gap:8px; color:#a8b5c5; font-size:14px; }
    .status::before { content:""; width:8px; height:8px; border-radius:50%; background:#59e7a1; box-shadow:0 0 12px #59e7a1; }
    .status.unanalysed::before,.status.uploading::before { background:var(--gold); box-shadow:0 0 12px #ffc857; }
    .header-actions { display:flex; align-items:center; gap:14px; }
    .menu-wrap { position:relative; }
    .menu-button { display:flex; align-items:center; gap:8px; padding:9px 13px; border:1px solid #34506d; border-radius:9px; background:#142335; cursor:pointer; transition:.15s ease; }
    .menu-button:hover,.menu-button[aria-expanded="true"] { border-color:var(--blue); background:#19304a; }
    .menu-icon { width:17px; display:grid; gap:3px; }
    .menu-icon span { height:2px; border-radius:2px; background:currentColor; }
    .app-menu { position:absolute; z-index:20; top:calc(100% + 9px); right:0; width:250px; padding:7px; border:1px solid #34465d; border-radius:12px; background:#111a26; box-shadow:0 18px 55px #000c; }
    .app-menu[hidden] { display:none; }
    .menu-label { padding:8px 10px 5px; color:#73849a; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .menu-item { width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px; border:0; border-radius:8px; background:transparent; color:#dfe9f5; text-align:left; cursor:pointer; }
    .menu-item:hover,.menu-item:focus-visible { outline:none; background:#1c2b3d; }
    .menu-item:disabled { color:#6f7c8d; cursor:wait; }
    .menu-hint { color:#718298; font-size:12px; }
    .menu-separator { height:1px; margin:6px 5px; background:#26364a; }
    .analysis-menu-status { padding:8px 10px 10px; color:#91a1b6; font-size:12px; line-height:1.45; }
    .analysis-progress { height:5px; margin-top:7px; overflow:hidden; border-radius:5px; background:#253246; }
    .analysis-progress span { display:block; width:0; height:100%; border-radius:5px; background:linear-gradient(90deg,var(--blue),var(--cyan)); transition:width .25s ease; }
    .status.failed::before { background:#ff6577; box-shadow:0 0 12px #ff6577; }
    main { display:grid; grid-template-columns:minmax(500px,1.12fr) minmax(430px,.88fr); height:calc(100vh - 70px); }
    .viewer { min-width:0; padding:24px; border-right:1px solid var(--line); overflow:auto; }
    .stage { overflow:hidden; border:1px solid #2a3a50; border-radius:16px; background:#000; box-shadow:0 22px 70px #0009; }
    video,.still-image { display:block; width:100%; aspect-ratio:16/9; background:#000; object-fit:contain; }
    .now { padding:18px 20px 20px; background:linear-gradient(120deg,#111b28,#0c141f); }
    .now-top { display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .eyebrow { color:var(--cyan); font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .method { color:var(--muted); font-size:12px; }
    .now h1 { margin:10px 0 7px; font-size:clamp(19px,2vw,25px); line-height:1.5; }
    .now p { margin:0; color:#9eacbd; line-height:1.65; font-size:14px; }
    .timeline { margin-top:22px; }
    .timeline-head { display:flex; justify-content:space-between; margin-bottom:9px; color:var(--muted); font-size:13px; }
    .rail { position:relative; display:flex; height:50px; padding:6px; gap:3px; overflow:hidden; border:1px solid #223149; border-radius:12px; background:#0c121b; }
    .scene-block { min-width:10px; height:100%; border:0; border-radius:7px; background:#194c6e; cursor:pointer; transition:.15s ease; }
    .scene-block:nth-child(even) { background:#205f83; }
    .scene-block:hover,.scene-block.selected { background:var(--blue); box-shadow:0 0 16px #35bfff88; }
    .markers { position:relative; height:40px; margin-top:4px; }
    .marker { position:absolute; top:0; width:7px; height:13px; border:0; border-radius:4px; background:#52677f; transform:translateX(-3px); cursor:pointer; }
    .marker.favorite { background:var(--gold); }
    .boundary-marker { position:absolute; width:4px; height:5px; border-radius:2px; transform:translateX(-2px); pointer-events:none; }
    .boundary-marker.current { top:17px; background:#ff9360; }
    .boundary-marker.adaptive { top:23px; background:#d879ff; }
    .boundary-marker.tuned { top:29px; background:#45bfff; }
    .boundary-marker.ground_truth { top:35px; background:#59e7a1; }
    .boundary-legend { display:flex; flex-wrap:wrap; gap:12px; color:#8595a9; font-size:11px; }
    .boundary-legend span::before { content:""; display:inline-block; width:9px; height:3px; margin:0 5px 3px 0; background:currentColor; }
    .boundary-legend .current { color:#ff9360; }.boundary-legend .adaptive { color:#d879ff; }.boundary-legend .tuned { color:#45bfff; }.boundary-legend .ground_truth { color:#59e7a1; }
    .library { min-width:0; display:flex; flex-direction:column; min-height:0; background:#0a1018; }
    .tools { padding:17px 19px 14px; border-bottom:1px solid var(--line); background:#0d141e; }
    .tools-line { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:13px; }
    .tools h2 { margin:0; font-size:18px; }
    .tabs { display:flex; padding:3px; gap:2px; border-radius:10px; background:#172231; }
    .tab { border:0; padding:7px 12px; border-radius:8px; background:transparent; color:#91a1b6; cursor:pointer; font-size:13px; }
    .tab.active { background:#276b94; color:white; box-shadow:0 2px 8px #0005; }
    .search-row { display:flex; gap:9px; }
    input[type=search] { flex:1; min-width:0; padding:11px 13px; border:1px solid #34445a; border-radius:10px; outline:none; background:#151f2c; }
    input[type=search]:focus { border-color:var(--blue); box-shadow:0 0 0 3px #28aaff22; }
    .filter { padding:0 13px; border:1px solid #34445a; border-radius:10px; background:#151f2c; cursor:pointer; }
    .filter.active { color:#1b1405; background:var(--gold); border-color:var(--gold); }
    .summary { margin-top:10px; color:#8190a4; font-size:13px; }
    #cards { padding:15px 17px 28px; overflow-y:auto; display:grid; gap:13px; }
    .card { padding:13px; border:1px solid #29384b; border-radius:14px; background:var(--raised); cursor:pointer; transition:.15s ease; }
    .card:hover,.card.selected { transform:translateY(-1px); border-color:var(--blue); background:#152335; }
    .scene-card { display:grid; grid-template-columns:190px 1fr; gap:15px; }
    .scene-images { display:grid; grid-template-columns:1fr 1fr; gap:4px; align-self:start; }
    .scene-images img { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:7px; background:#020407; }
    .scene-images img:first-child:last-child,.scene-images img:first-child:nth-last-child(2) { grid-column:1/-1; }
    .scene-images img:first-child:nth-last-child(3) { grid-row:span 2; height:100%; }
    .card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .badges { display:flex; flex-wrap:wrap; gap:5px; }
    .badge { padding:4px 8px; border-radius:999px; background:#223248; color:#b6c5d7; font-size:12px; }
    .badge.live { color:#78edb1; background:#123726; }
    .badge.final { color:#8ee8ff; background:#123442; }
    .scene-title { margin:10px 0 6px; font-size:16px; line-height:1.55; font-weight:650; }
    .objects { color:#8797aa; font-size:13px; line-height:1.5; }
    .fragment-list { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
    .fragment-chip { padding:3px 7px; border-radius:6px; background:#0d1621; color:#8fa1b6; font-size:11px; }
    .fragment-card { display:grid; grid-template-columns:154px 1fr; gap:14px; }
    .thumb { position:relative; align-self:start; }
    .thumb img { display:block; width:154px; aspect-ratio:16/9; object-fit:cover; border-radius:9px; background:#020407; }
    .time { position:absolute; right:6px; bottom:6px; padding:3px 6px; border-radius:6px; background:#000d; font-size:11px; }
    .star { border:0; padding:0; background:none; color:#66758a; font-size:22px; cursor:pointer; line-height:1; }
    .star.on { color:var(--gold); }
    .edit { display:flex; gap:7px; margin-top:9px; }
    .edit input { flex:1; min-width:0; padding:7px 9px; border:1px solid #334258; border-radius:7px; color:inherit; background:#0d141e; }
    .save { border:0; border-radius:7px; padding:0 11px; background:#197fbc; cursor:pointer; }
    .empty { padding:46px 20px; text-align:center; color:#7f8da0; }
    @media (max-width:980px) { main { display:block; height:auto; } .viewer { border-right:0; } .library { height:720px; border-top:1px solid var(--line); } }
    @media (max-width:560px) { header { padding:0 15px; } .product,.status { display:none; } .menu-button { padding:8px 10px; } .viewer { padding:14px; } .scene-card,.fragment-card { grid-template-columns:1fr; } .scene-images { max-height:230px; } .thumb img { width:100%; } }
  </style>
</head>
<body>
  <header><div class="brand"><div class="logo">AI</div><div>AI NAS Manager <span class="product">Scene Studio</span></div></div><div class="header-actions"><div class="menu-wrap"><button id="menuButton" class="menu-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="appMenu"><span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>メニュー</button><div id="appMenu" class="app-menu" role="menu" hidden><div class="menu-label">ファイル</div><button id="chooseVideo" class="menu-item" type="button" role="menuitem"><span>Windowsから映像を開く…</span><span class="menu-hint">MP4ほか</span></button><button id="chooseImage" class="menu-item" type="button" role="menuitem"><span>Windowsから画像を開く…</span><span class="menu-hint">JPG・PNGほか</span></button><div class="menu-separator"></div><div class="menu-label">解析</div><button class="menu-item" type="button" role="menuitem" data-analysis-mode="static"><span>静的解析を開始</span><span class="menu-hint">高速</span></button><button class="menu-item" type="button" role="menuitem" data-analysis-mode="realtime"><span>リアルタイム解析を開始</span><span class="menu-hint">時刻同期</span></button><div class="analysis-menu-status" id="analysisMenuStatus">解析方法を選択してください<div class="analysis-progress"><span id="analysisProgress"></span></div></div><div class="menu-separator"></div><div class="menu-label">表示</div><button class="menu-item" type="button" role="menuitem" data-menu-mode="scenes"><span>Sceneを表示</span><span class="menu-hint">整理済み</span></button><button class="menu-item" type="button" role="menuitem" data-menu-mode="fragments"><span>Fragmentを表示</span><span class="menu-hint">検出結果</span></button><div class="menu-separator"></div><div class="menu-label">操作</div><button id="togglePlayback" class="menu-item" type="button" role="menuitem"><span>再生／一時停止</span><span class="menu-hint">Space</span></button><button id="reloadData" class="menu-item" type="button" role="menuitem"><span>データを再読込</span><span class="menu-hint">更新</span></button></div></div><div class="status" id="pipelineStatus">解析済み</div></div></header>
  <main>
    <section class="viewer">
      <div class="stage">
        <video id="video" controls preload="metadata" src="/media/video"></video>
        <img id="stillImage" class="still-image" alt="選択した画像" hidden>
        <div class="now"><div class="now-top"><div class="eyebrow" id="selectionType">Selected Scene</div><div class="method" id="method"></div></div><h1 id="nowText">Sceneを選択してください</h1><p id="nowMeta">Sceneカードまたはタイムラインを選ぶと、その開始位置から再生します。</p></div>
      </div>
      <div class="timeline"><div class="timeline-head"><span>Scene timeline</span><span id="sourceName"></span></div><div class="rail" id="rail" aria-label="Scene timeline"></div><div class="markers" id="markers" aria-label="Fragment and boundary markers"></div><div class="boundary-legend"><span class="current">現行</span><span class="adaptive">Adaptive標準</span><span class="tuned">Adaptive調整</span><span class="ground_truth">正解Marker</span></div></div>
    </section>
    <section class="library">
      <div class="tools">
        <div class="tools-line"><h2 id="libraryTitle">映像Scene Database</h2><div class="tabs" role="tablist"><button class="tab active" data-mode="scenes" role="tab">Scene</button><button class="tab" data-mode="fragments" role="tab">Fragment</button></div></div>
        <div class="search-row"><input id="search" type="search" placeholder="人物、行動、場所を検索…" autocomplete="off"><button id="favorites" class="filter" aria-label="お気に入りだけ表示">★</button></div>
        <div class="summary" id="summary">読み込み中…</div>
      </div>
      <div id="cards"></div>
    </section>
  </main>
  <script>
    const video=document.querySelector('#video'),stillImage=document.querySelector('#stillImage'),cards=document.querySelector('#cards'),search=document.querySelector('#search'),favoriteButton=document.querySelector('#favorites'),chooseVideo=document.querySelector('#chooseVideo'),chooseImage=document.querySelector('#chooseImage'),pipelineStatus=document.querySelector('#pipelineStatus'),menuButton=document.querySelector('#menuButton'),appMenu=document.querySelector('#appMenu'),analysisMenuStatus=document.querySelector('#analysisMenuStatus'),analysisProgress=document.querySelector('#analysisProgress'),realtimeButton=document.querySelector('[data-analysis-mode="realtime"]'),togglePlayback=document.querySelector('#togglePlayback');
    let mode='scenes',mediaKind='video',scenes=[],fragments=[],shadowBoundaries=[],boundaryMarkers={},favoritesOnly=false,selectedId='',lastAnalysisState='',lastAnalysisCount=-1;
    const timecode=ms=>{const s=Math.max(0,ms)/1000;return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}.${String(Math.floor(ms%1000/100))}`};
    const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    function updateAnalysisStatus(analysis){if(!analysis)return;const labels={ready:'解析済み',not_analyzed:'未解析',running:analysis.mode==='realtime'?'リアルタイム解析中':'静的解析中',failed:'解析失敗'};pipelineStatus.textContent=labels[analysis.state]||analysis.state;pipelineStatus.className=`status ${analysis.state==='failed'?'failed':analysis.state==='running'||analysis.state==='not_analyzed'?'unanalysed':''}`;const percent=Math.round((analysis.progress||0)*100);const detail=analysis.state==='failed'&&analysis.error?analysis.error:analysis.message||labels[analysis.state]||'';analysisProgress.style.width=`${percent}%`;analysisMenuStatus.childNodes[0].nodeValue=`${detail}${analysis.state==='running'?` · ${percent}%`:''}`;document.querySelectorAll('[data-analysis-mode]').forEach(button=>button.disabled=analysis.state==='running'||(mediaKind==='image'&&button.dataset.analysisMode==='realtime'))}
    function showMedia(kind){mediaKind=kind||'video';const isImage=mediaKind==='image';video.hidden=isImage;stillImage.hidden=!isImage;realtimeButton.disabled=isImage;togglePlayback.disabled=isImage;if(isImage){video.pause();stillImage.src=`/media/image?v=${Date.now()}`}else if(video.hidden===false&&!video.src.includes('/media/video')){video.src=`/media/video?v=${Date.now()}`;video.load()}}
    async function load(){const params=new URLSearchParams({q:search.value});if(favoritesOnly)params.set('favorites','1');const endpoint=mode==='scenes'?'scenes':'fragments';const response=await fetch(`/api/${endpoint}?${params}`);if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();if(data.media_kind&&data.media_kind!==mediaKind)showMedia(data.media_kind);scenes=data.scenes||[];fragments=data.fragments||[];shadowBoundaries=data.shadow_boundaries||[];boundaryMarkers=data.boundary_markers||{};document.querySelector('#sourceName').textContent=data.source_name;document.querySelector('#summary').textContent=mode==='scenes'?`${scenes.length} Scene · ${scenes.reduce((sum,item)=>sum+item.fragment_count,0)} Fragment · Shadow ${shadowBoundaries.length}`:`${fragments.length}件のText付きFragment`;updateAnalysisStatus(data.analysis);render()}
    function uploadVideo(file){const previewUrl=URL.createObjectURL(file);video.src=previewUrl;video.load();pipelineStatus.textContent='映像を転送中 0%';pipelineStatus.className='status uploading';const request=new XMLHttpRequest();request.open('POST','/api/media/select');request.setRequestHeader('Content-Type','application/octet-stream');request.setRequestHeader('X-File-Name',encodeURIComponent(file.name));request.upload.onprogress=event=>{if(event.lengthComputable)pipelineStatus.textContent=`映像を転送中 ${Math.round(event.loaded/event.total*100)}%`};request.onload=async()=>{URL.revokeObjectURL(previewUrl);if(request.status<200||request.status>=300){pipelineStatus.textContent='転送エラー';pipelineStatus.className='status unanalysed';document.querySelector('#nowText').textContent='映像ファイルを読み込めませんでした';document.querySelector('#nowMeta').textContent=`HTTP ${request.status}。対応形式を確認してください。`;return}selectedId='';video.src=`/media/video?v=${Date.now()}`;video.load();document.querySelector('#selectionType').textContent='Selected Video';document.querySelector('#method').textContent='解析前';document.querySelector('#nowText').textContent=file.name;document.querySelector('#nowMeta').textContent='映像を選択しました。Fragment解析を実行すると、Sceneと説明がここに追加されます。';await load()};request.onerror=()=>{pipelineStatus.textContent='転送エラー';pipelineStatus.className='status unanalysed';document.querySelector('#nowText').textContent='映像の転送に失敗しました';document.querySelector('#nowMeta').textContent='PC Appサーバーの接続を確認してください。'};request.send(file)}
    async function pickVideo(){closeMenu();chooseVideo.disabled=true;pipelineStatus.textContent='Windowsで選択中';try{const response=await fetch('/api/media/browse',{method:'POST',headers:{'X-AI-NAS-Action':'browse-local-video'}});if(response.status===204){await load();return}if(!response.ok)throw new Error(`HTTP ${response.status}`);const result=await response.json();selectedId='';video.src=`/media/video?v=${Date.now()}`;video.load();document.querySelector('#selectionType').textContent='Selected Video';document.querySelector('#method').textContent='解析前';document.querySelector('#nowText').textContent=result.source_name;document.querySelector('#nowMeta').textContent='映像を選択しました。Fragment解析を実行すると、Sceneと説明がここに追加されます。';await load()}catch(error){pipelineStatus.textContent='選択エラー';pipelineStatus.className='status unanalysed';document.querySelector('#nowText').textContent='映像ファイルを開けませんでした';document.querySelector('#nowMeta').textContent=`${error.message}。PC Appを再起動して、もう一度選択してください。`}finally{chooseVideo.disabled=false}}
    async function pickImage(){closeMenu();chooseImage.disabled=true;pipelineStatus.textContent='Windowsで画像を選択中';try{const response=await fetch('/api/media/browse-image',{method:'POST',headers:{'X-AI-NAS-Action':'browse-local-image'}});if(response.status===204){await load();return}if(!response.ok)throw new Error(`HTTP ${response.status}`);const result=await response.json();selectedId='';showMedia('image');document.querySelector('#selectionType').textContent='Selected Image';document.querySelector('#method').textContent='解析前';document.querySelector('#nowText').textContent=result.source_name;document.querySelector('#nowMeta').textContent='画像を選択しました。「静的解析を開始」でGemmaの説明を生成します。';await load()}catch(error){pipelineStatus.textContent='選択エラー';pipelineStatus.className='status unanalysed';document.querySelector('#nowText').textContent='画像ファイルを開けませんでした';document.querySelector('#nowMeta').textContent=`${error.message}。対応形式を確認してください。`}finally{chooseImage.disabled=false}}
    async function startAnalysis(analysisMode){closeMenu();try{const response=await fetch('/api/analysis/start',{method:'POST',headers:{'Content-Type':'application/json','X-AI-NAS-Action':'start-analysis'},body:JSON.stringify({mode:analysisMode})});if(!response.ok)throw new Error(response.status===409?'すでに解析中です':`HTTP ${response.status}`);const analysis=await response.json();mode='fragments';selectedId='';document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item.dataset.mode===mode));document.querySelector('#libraryTitle').textContent='映像Fragment Database';updateAnalysisStatus(analysis);if(analysisMode==='realtime'){video.currentTime=0;video.play().catch(()=>{})}await load()}catch(error){pipelineStatus.textContent='開始エラー';pipelineStatus.className='status failed';document.querySelector('#nowMeta').textContent=`解析を開始できません：${error.message}`}}
    async function pollAnalysis(){try{const response=await fetch('/api/analysis/status');if(!response.ok)return;const analysis=await response.json();const changed=analysis.state!==lastAnalysisState||analysis.fragment_count!==lastAnalysisCount;const wasRunning=lastAnalysisState==='running';lastAnalysisState=analysis.state;lastAnalysisCount=analysis.fragment_count;updateAnalysisStatus(analysis);if(changed&&(analysis.state==='running'||wasRunning))await load()}catch(error){}}
    function seekMedia(ms){if(mediaKind==='video'){video.currentTime=ms/1000;video.play().catch(()=>{})}}
    function selectScene(scene){selectedId=scene.id;seekMedia(scene.start_ms);document.querySelector('#selectionType').textContent=`Scene ${String(scene.index).padStart(2,'0')}`;document.querySelector('#method').textContent=scene.boundary_method;document.querySelector('#nowText').textContent=scene.summary;document.querySelector('#nowMeta').textContent=`${timecode(scene.start_ms)} — ${timecode(scene.end_ms)} · ${scene.fragment_count} Fragment · 確信度 ${Math.round(scene.confidence*100)}%`;render()}
    function selectFragment(item){selectedId=item.id;seekMedia(item.timestamp_ms);document.querySelector('#selectionType').textContent='Selected Fragment';document.querySelector('#method').textContent=`Revision ${item.revision}`;document.querySelector('#nowText').textContent=item.user_text||item.observation;document.querySelector('#nowMeta').textContent=`${timecode(item.timestamp_ms)} · ${item.objects.join(' / ')} · 確信度 ${Math.round(item.confidence*100)}%`;render()}
    async function save(item,userText,favorite){await fetch(`/api/fragments/${encodeURIComponent(item.id)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_text:userText,favorite})});await load()}
    function renderScenes(){cards.innerHTML=scenes.length?scenes.map(scene=>`<article class="card scene-card ${scene.id===selectedId?'selected':''}" data-id="${escapeHtml(scene.id)}"><div class="scene-images">${scene.thumbnail_ids.map(id=>`<img src="/api/thumbnail/${encodeURIComponent(id)}" alt="Scene ${scene.index} evidence">`).join('')}</div><div><div class="card-head"><div class="badges"><span class="badge final">Scene ${String(scene.index).padStart(2,'0')}</span><span class="badge">${timecode(scene.start_ms)}–${timecode(scene.end_ms)}</span>${scene.completed_during_stream?'<span class="badge live">Live</span>':''}${scene.summary_method==='gemma_multi_fragment'?'<span class="badge final">Gemma Scene要約</span>':''}</div>${scene.favorite?'<span class="star on">★</span>':''}</div><div class="scene-title">${escapeHtml(scene.summary)}</div><div class="objects">${escapeHtml(scene.objects.join(' · ')||'物体情報なし')}</div>${scene.important_change?`<div class="objects">変化：${escapeHtml(scene.important_change)}</div>`:''}<div class="fragment-list">${scene.fragments.map(item=>`<span class="fragment-chip">${timecode(item.timestamp_ms)} · r${item.revision}</span>`).join('')}</div></div></article>`).join(''):'<div class="empty">一致するSceneがありません。</div>';cards.querySelectorAll('.scene-card').forEach(card=>card.addEventListener('click',()=>selectScene(scenes.find(item=>item.id===card.dataset.id))))}
    function renderFragments(){cards.innerHTML=fragments.length?fragments.map(item=>`<article class="card fragment-card ${item.id===selectedId?'selected':''}" data-id="${escapeHtml(item.id)}"><div class="thumb"><img src="/api/thumbnail/${encodeURIComponent(item.id)}" alt=""><span class="time">${timecode(item.timestamp_ms)}</span></div><div><div class="card-head"><div class="badges"><span class="badge">Revision ${item.revision}</span>${item.completed_during_stream?'<span class="badge live">Live</span>':''}</div><button class="star ${item.favorite?'on':''}" title="お気に入り">★</button></div><div class="scene-title">${escapeHtml(item.user_text||item.observation)}</div><div class="objects">${escapeHtml(item.objects.join(' · '))}</div><div class="edit"><input value="${escapeHtml(item.user_text)}" placeholder="説明を修正・追記"><button class="save">保存</button></div></div></article>`).join(''):'<div class="empty">一致するFragmentがありません。</div>';cards.querySelectorAll('.fragment-card').forEach(card=>{const item=fragments.find(value=>value.id===card.dataset.id);card.addEventListener('click',event=>{if(!event.target.closest('button,input'))selectFragment(item)});card.querySelector('.star').addEventListener('click',()=>save(item,card.querySelector('input').value,!item.favorite));card.querySelector('.save').addEventListener('click',()=>save(item,card.querySelector('input').value,item.favorite))})}
    function renderTimeline(){const allFragments=mode==='scenes'?scenes.flatMap(item=>item.fragments):fragments;const boundaryTimes=Object.values(boundaryMarkers).flat();const max=Math.max(1,...scenes.map(item=>item.end_ms),...allFragments.map(item=>item.timestamp_ms),...boundaryTimes);const rail=document.querySelector('#rail');rail.innerHTML=scenes.map(scene=>`<button class="scene-block ${scene.id===selectedId?'selected':''}" style="flex:${Math.max(1,scene.end_ms-scene.start_ms)}" data-id="${escapeHtml(scene.id)}" title="Scene ${scene.index} · ${timecode(scene.start_ms)}"></button>`).join('');rail.querySelectorAll('.scene-block').forEach(block=>block.addEventListener('click',()=>selectScene(scenes.find(item=>item.id===block.dataset.id))));const markers=document.querySelector('#markers');const boundaryHtml=Object.entries(boundaryMarkers).flatMap(([kind,values])=>values.map(value=>`<span class="boundary-marker ${kind}" style="left:${value/max*100}%" title="${kind} ${timecode(value)}"></span>`)).join('');markers.innerHTML=allFragments.map(item=>`<button class="marker fragment-marker ${item.favorite?'favorite':''}" style="left:${item.timestamp_ms/max*100}%" data-id="${escapeHtml(item.id)}" title="Fragment ${timecode(item.timestamp_ms)}"></button>`).join('')+boundaryHtml;markers.querySelectorAll('.fragment-marker').forEach(marker=>marker.addEventListener('click',()=>{const item=allFragments.find(value=>value.id===marker.dataset.id);if(mode!=='fragments')seekMedia(item.timestamp_ms);else selectFragment(item)}))}
    function render(){mode==='scenes'?renderScenes():renderFragments();renderTimeline()}
    function closeMenu(){appMenu.hidden=true;menuButton.setAttribute('aria-expanded','false')}
    function switchMode(nextMode){mode=nextMode;selectedId='';document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item.dataset.mode===mode));document.querySelector('#libraryTitle').textContent=mode==='scenes'?'映像Scene Database':'映像Fragment Database';closeMenu();load()}
    menuButton.addEventListener('click',()=>{const opening=appMenu.hidden;appMenu.hidden=!opening;menuButton.setAttribute('aria-expanded',String(opening));if(opening)appMenu.querySelector('.menu-item').focus()});document.addEventListener('click',event=>{if(!event.target.closest('.menu-wrap'))closeMenu()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu();if(mediaKind==='video'&&event.code==='Space'&&!event.target.matches('input,button')){event.preventDefault();video.paused?video.play().catch(()=>{}):video.pause()}});document.querySelectorAll('[data-menu-mode]').forEach(item=>item.addEventListener('click',()=>switchMode(item.dataset.menuMode)));document.querySelectorAll('[data-analysis-mode]').forEach(item=>item.addEventListener('click',()=>startAnalysis(item.dataset.analysisMode)));togglePlayback.addEventListener('click',()=>{if(mediaKind==='video'){video.paused?video.play().catch(()=>{}):video.pause()}closeMenu()});document.querySelector('#reloadData').addEventListener('click',()=>{closeMenu();load()});document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>switchMode(tab.dataset.mode)));let timer;search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,180)});favoriteButton.addEventListener('click',()=>{favoritesOnly=!favoritesOnly;favoriteButton.classList.toggle('active',favoritesOnly);load()});chooseVideo.addEventListener('click',pickVideo);chooseImage.addEventListener('click',pickImage);load().then(pollAnalysis).catch(error=>{cards.innerHTML=`<div class="empty">読み込みに失敗しました：${escapeHtml(error.message)}</div>`});setInterval(pollAnalysis,1000);
  </script>
</body>
</html>
