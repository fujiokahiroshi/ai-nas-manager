<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI NAS Manager — Scene Studio</title>
  <style>
    :root { color-scheme: dark; font-family: "Yu Gothic UI","Meiryo",system-ui,sans-serif; --bg:#070a0f; --panel:#0d131c; --raised:#121b27; --line:#263448; --text:#edf5ff; --muted:#91a0b4; --blue:#45bfff; --cyan:#55e7d0; --gold:#ffc857; }
    * { box-sizing: border-box; }
    body { margin:0; background:radial-gradient(circle at 28% 0%,#10253a 0,transparent 34%),var(--bg); color:var(--text); }
    button,input { color:inherit; font:inherit; }
    header { height:70px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; border-bottom:1px solid var(--line); background:#090e15e8; backdrop-filter:blur(14px); }
    .brand { display:flex; align-items:center; gap:12px; font-weight:750; letter-spacing:.02em; }
    .logo { width:38px; height:38px; display:grid; place-items:center; border-radius:11px; background:linear-gradient(145deg,#38d5ff,#315fea); box-shadow:0 0 26px #2aaaff55; font-size:13px; }
    .product { color:#7f90a6; font-weight:500; }
    .status { display:flex; align-items:center; gap:8px; color:#a8b5c5; font-size:14px; }
    .status::before { content:""; width:8px; height:8px; border-radius:50%; background:#59e7a1; box-shadow:0 0 12px #59e7a1; }
    main { display:grid; grid-template-columns:minmax(500px,1.12fr) minmax(430px,.88fr); height:calc(100vh - 70px); }
    .viewer { min-width:0; padding:24px; border-right:1px solid var(--line); overflow:auto; }
    .stage { overflow:hidden; border:1px solid #2a3a50; border-radius:16px; background:#000; box-shadow:0 22px 70px #0009; }
    video { display:block; width:100%; aspect-ratio:16/9; background:#000; }
    .now { padding:18px 20px 20px; background:linear-gradient(120deg,#111b28,#0c141f); }
    .now-top { display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .eyebrow { color:var(--cyan); font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .method { color:var(--muted); font-size:12px; }
    .now h1 { margin:10px 0 7px; font-size:clamp(19px,2vw,25px); line-height:1.5; }
    .now p { margin:0; color:#9eacbd; line-height:1.65; font-size:14px; }
    .timeline { margin-top:22px; }
    .timeline-head { display:flex; justify-content:space-between; margin-bottom:9px; color:var(--muted); font-size:13px; }
    .rail { position:relative; display:flex; height:50px; padding:6px; gap:3px; overflow:hidden; border:1px solid #223149; border-radius:12px; background:#0c121b; }
    .scene-block { min-width:10px; height:100%; border:0; border-radius:7px; background:#194c6e; cursor:pointer; transition:.15s ease; }
    .scene-block:nth-child(even) { background:#205f83; }
    .scene-block:hover,.scene-block.selected { background:var(--blue); box-shadow:0 0 16px #35bfff88; }
    .markers { position:relative; height:18px; margin-top:4px; }
    .marker { position:absolute; top:1px; width:7px; height:15px; border:0; border-radius:4px; background:#52677f; transform:translateX(-3px); cursor:pointer; }
    .marker.favorite { background:var(--gold); }
    .shadow-boundary { position:absolute; top:0; width:3px; height:18px; border-radius:2px; background:#d879ff; box-shadow:0 0 9px #d879ff; transform:translateX(-1px); pointer-events:none; }
    .library { min-width:0; display:flex; flex-direction:column; min-height:0; background:#0a1018; }
    .tools { padding:17px 19px 14px; border-bottom:1px solid var(--line); background:#0d141e; }
    .tools-line { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:13px; }
    .tools h2 { margin:0; font-size:18px; }
    .tabs { display:flex; padding:3px; gap:2px; border-radius:10px; background:#172231; }
    .tab { border:0; padding:7px 12px; border-radius:8px; background:transparent; color:#91a1b6; cursor:pointer; font-size:13px; }
    .tab.active { background:#276b94; color:white; box-shadow:0 2px 8px #0005; }
    .search-row { display:flex; gap:9px; }
    input[type=search] { flex:1; min-width:0; padding:11px 13px; border:1px solid #34445a; border-radius:10px; outline:none; background:#151f2c; }
    input[type=search]:focus { border-color:var(--blue); box-shadow:0 0 0 3px #28aaff22; }
    .filter { padding:0 13px; border:1px solid #34445a; border-radius:10px; background:#151f2c; cursor:pointer; }
    .filter.active { color:#1b1405; background:var(--gold); border-color:var(--gold); }
    .summary { margin-top:10px; color:#8190a4; font-size:13px; }
    #cards { padding:15px 17px 28px; overflow-y:auto; display:grid; gap:13px; }
    .card { padding:13px; border:1px solid #29384b; border-radius:14px; background:var(--raised); cursor:pointer; transition:.15s ease; }
    .card:hover,.card.selected { transform:translateY(-1px); border-color:var(--blue); background:#152335; }
    .scene-card { display:grid; grid-template-columns:190px 1fr; gap:15px; }
    .scene-images { display:grid; grid-template-columns:1fr 1fr; gap:4px; align-self:start; }
    .scene-images img { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:7px; background:#020407; }
    .scene-images img:first-child:last-child,.scene-images img:first-child:nth-last-child(2) { grid-column:1/-1; }
    .scene-images img:first-child:nth-last-child(3) { grid-row:span 2; height:100%; }
    .card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .badges { display:flex; flex-wrap:wrap; gap:5px; }
    .badge { padding:4px 8px; border-radius:999px; background:#223248; color:#b6c5d7; font-size:12px; }
    .badge.live { color:#78edb1; background:#123726; }
    .badge.final { color:#8ee8ff; background:#123442; }
    .scene-title { margin:10px 0 6px; font-size:16px; line-height:1.55; font-weight:650; }
    .objects { color:#8797aa; font-size:13px; line-height:1.5; }
    .fragment-list { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
    .fragment-chip { padding:3px 7px; border-radius:6px; background:#0d1621; color:#8fa1b6; font-size:11px; }
    .fragment-card { display:grid; grid-template-columns:154px 1fr; gap:14px; }
    .thumb { position:relative; align-self:start; }
    .thumb img { display:block; width:154px; aspect-ratio:16/9; object-fit:cover; border-radius:9px; background:#020407; }
    .time { position:absolute; right:6px; bottom:6px; padding:3px 6px; border-radius:6px; background:#000d; font-size:11px; }
    .star { border:0; padding:0; background:none; color:#66758a; font-size:22px; cursor:pointer; line-height:1; }
    .star.on { color:var(--gold); }
    .edit { display:flex; gap:7px; margin-top:9px; }
    .edit input { flex:1; min-width:0; padding:7px 9px; border:1px solid #334258; border-radius:7px; color:inherit; background:#0d141e; }
    .save { border:0; border-radius:7px; padding:0 11px; background:#197fbc; cursor:pointer; }
    .empty { padding:46px 20px; text-align:center; color:#7f8da0; }
    @media (max-width:980px) { main { display:block; height:auto; } .viewer { border-right:0; } .library { height:720px; border-top:1px solid var(--line); } }
    @media (max-width:560px) { header { padding:0 15px; } .product,.status { display:none; } .viewer { padding:14px; } .scene-card,.fragment-card { grid-template-columns:1fr; } .scene-images { max-height:230px; } .thumb img { width:100%; } }
  </style>
</head>
<body>
  <header><div class="brand"><div class="logo">AI</div><div>AI NAS Manager <span class="product">Scene Studio</span></div></div><div class="status">Local Edge Pipeline</div></header>
  <main>
    <section class="viewer">
      <div class="stage">
        <video id="video" controls preload="metadata" src="/media/video"></video>
        <div class="now"><div class="now-top"><div class="eyebrow" id="selectionType">Selected Scene</div><div class="method" id="method"></div></div><h1 id="nowText">Sceneを選択してください</h1><p id="nowMeta">Sceneカードまたはタイムラインを選ぶと、その開始位置から再生します。</p></div>
      </div>
      <div class="timeline"><div class="timeline-head"><span>Scene timeline</span><span id="sourceName"></span></div><div class="rail" id="rail" aria-label="Scene timeline"></div><div class="markers" id="markers" aria-label="Fragment markers"></div></div>
    </section>
    <section class="library">
      <div class="tools">
        <div class="tools-line"><h2 id="libraryTitle">映像Scene Database</h2><div class="tabs" role="tablist"><button class="tab active" data-mode="scenes" role="tab">Scene</button><button class="tab" data-mode="fragments" role="tab">Fragment</button></div></div>
        <div class="search-row"><input id="search" type="search" placeholder="人物、行動、場所を検索…" autocomplete="off"><button id="favorites" class="filter" aria-label="お気に入りだけ表示">★</button></div>
        <div class="summary" id="summary">読み込み中…</div>
      </div>
      <div id="cards"></div>
    </section>
  </main>
  <script>
    const video=document.querySelector('#video'),cards=document.querySelector('#cards'),search=document.querySelector('#search'),favoriteButton=document.querySelector('#favorites');
    let mode='scenes',scenes=[],fragments=[],shadowBoundaries=[],favoritesOnly=false,selectedId='';
    const timecode=ms=>{const s=Math.max(0,ms)/1000;return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}.${String(Math.floor(ms%1000/100))}`};
    const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    async function load(){const params=new URLSearchParams({q:search.value});if(favoritesOnly)params.set('favorites','1');const endpoint=mode==='scenes'?'scenes':'fragments';const response=await fetch(`/api/${endpoint}?${params}`);if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();scenes=data.scenes||[];fragments=data.fragments||[];shadowBoundaries=data.shadow_boundaries||[];document.querySelector('#sourceName').textContent=data.source_name;document.querySelector('#summary').textContent=mode==='scenes'?`${scenes.length} Scene · ${scenes.reduce((sum,item)=>sum+item.fragment_count,0)} Fragment · Shadow ${shadowBoundaries.length}`:`${fragments.length}件のText付きFragment`;render()}
    function selectScene(scene){selectedId=scene.id;video.currentTime=scene.start_ms/1000;video.play().catch(()=>{});document.querySelector('#selectionType').textContent=`Scene ${String(scene.index).padStart(2,'0')}`;document.querySelector('#method').textContent=scene.boundary_method;document.querySelector('#nowText').textContent=scene.summary;document.querySelector('#nowMeta').textContent=`${timecode(scene.start_ms)} — ${timecode(scene.end_ms)} · ${scene.fragment_count} Fragment · 確信度 ${Math.round(scene.confidence*100)}%`;render()}
    function selectFragment(item){selectedId=item.id;video.currentTime=item.timestamp_ms/1000;video.play().catch(()=>{});document.querySelector('#selectionType').textContent='Selected Fragment';document.querySelector('#method').textContent=`Revision ${item.revision}`;document.querySelector('#nowText').textContent=item.user_text||item.observation;document.querySelector('#nowMeta').textContent=`${timecode(item.timestamp_ms)} · ${item.objects.join(' / ')} · 確信度 ${Math.round(item.confidence*100)}%`;render()}
    async function save(item,userText,favorite){await fetch(`/api/fragments/${encodeURIComponent(item.id)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_text:userText,favorite})});await load()}
    function renderScenes(){cards.innerHTML=scenes.length?scenes.map(scene=>`<article class="card scene-card ${scene.id===selectedId?'selected':''}" data-id="${escapeHtml(scene.id)}"><div class="scene-images">${scene.thumbnail_ids.map(id=>`<img src="/api/thumbnail/${encodeURIComponent(id)}" alt="Scene ${scene.index} evidence">`).join('')}</div><div><div class="card-head"><div class="badges"><span class="badge final">Scene ${String(scene.index).padStart(2,'0')}</span><span class="badge">${timecode(scene.start_ms)}–${timecode(scene.end_ms)}</span>${scene.completed_during_stream?'<span class="badge live">Live</span>':''}${scene.summary_method==='gemma_multi_fragment'?'<span class="badge final">Gemma Scene要約</span>':''}</div>${scene.favorite?'<span class="star on">★</span>':''}</div><div class="scene-title">${escapeHtml(scene.summary)}</div><div class="objects">${escapeHtml(scene.objects.join(' · ')||'物体情報なし')}</div>${scene.important_change?`<div class="objects">変化：${escapeHtml(scene.important_change)}</div>`:''}<div class="fragment-list">${scene.fragments.map(item=>`<span class="fragment-chip">${timecode(item.timestamp_ms)} · r${item.revision}</span>`).join('')}</div></div></article>`).join(''):'<div class="empty">一致するSceneがありません。</div>';cards.querySelectorAll('.scene-card').forEach(card=>card.addEventListener('click',()=>selectScene(scenes.find(item=>item.id===card.dataset.id))))}
    function renderFragments(){cards.innerHTML=fragments.length?fragments.map(item=>`<article class="card fragment-card ${item.id===selectedId?'selected':''}" data-id="${escapeHtml(item.id)}"><div class="thumb"><img src="/api/thumbnail/${encodeURIComponent(item.id)}" alt=""><span class="time">${timecode(item.timestamp_ms)}</span></div><div><div class="card-head"><div class="badges"><span class="badge">Revision ${item.revision}</span>${item.completed_during_stream?'<span class="badge live">Live</span>':''}</div><button class="star ${item.favorite?'on':''}" title="お気に入り">★</button></div><div class="scene-title">${escapeHtml(item.user_text||item.observation)}</div><div class="objects">${escapeHtml(item.objects.join(' · '))}</div><div class="edit"><input value="${escapeHtml(item.user_text)}" placeholder="説明を修正・追記"><button class="save">保存</button></div></div></article>`).join(''):'<div class="empty">一致するFragmentがありません。</div>';cards.querySelectorAll('.fragment-card').forEach(card=>{const item=fragments.find(value=>value.id===card.dataset.id);card.addEventListener('click',event=>{if(!event.target.closest('button,input'))selectFragment(item)});card.querySelector('.star').addEventListener('click',()=>save(item,card.querySelector('input').value,!item.favorite));card.querySelector('.save').addEventListener('click',()=>save(item,card.querySelector('input').value,item.favorite))})}
    function renderTimeline(){const allFragments=mode==='scenes'?scenes.flatMap(item=>item.fragments):fragments;const max=Math.max(1,...scenes.map(item=>item.end_ms),...allFragments.map(item=>item.timestamp_ms),...shadowBoundaries.map(item=>item.boundary_ms));const rail=document.querySelector('#rail');rail.innerHTML=scenes.map(scene=>`<button class="scene-block ${scene.id===selectedId?'selected':''}" style="flex:${Math.max(1,scene.end_ms-scene.start_ms)}" data-id="${escapeHtml(scene.id)}" title="Scene ${scene.index} · ${timecode(scene.start_ms)}"></button>`).join('');rail.querySelectorAll('.scene-block').forEach(block=>block.addEventListener('click',()=>selectScene(scenes.find(item=>item.id===block.dataset.id))));const markers=document.querySelector('#markers');markers.innerHTML=allFragments.map(item=>`<button class="marker fragment-marker ${item.favorite?'favorite':''}" style="left:${item.timestamp_ms/max*100}%" data-id="${escapeHtml(item.id)}" title="Fragment ${timecode(item.timestamp_ms)}"></button>`).join('')+shadowBoundaries.map(item=>`<span class="shadow-boundary" style="left:${item.boundary_ms/max*100}%" title="Adaptive Memory Shadow ${timecode(item.boundary_ms)}"></span>`).join('');markers.querySelectorAll('.fragment-marker').forEach(marker=>marker.addEventListener('click',()=>{const item=allFragments.find(value=>value.id===marker.dataset.id);if(mode!=='fragments'){video.currentTime=item.timestamp_ms/1000;video.play().catch(()=>{})}else selectFragment(item)}))}
    function render(){mode==='scenes'?renderScenes():renderFragments();renderTimeline()}
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{mode=tab.dataset.mode;selectedId='';document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===tab));document.querySelector('#libraryTitle').textContent=mode==='scenes'?'映像Scene Database':'映像Fragment Database';load()}));let timer;search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,180)});favoriteButton.addEventListener('click',()=>{favoritesOnly=!favoritesOnly;favoriteButton.classList.toggle('active',favoritesOnly);load()});load().catch(error=>{cards.innerHTML=`<div class="empty">読み込みに失敗しました：${escapeHtml(error.message)}</div>`});
  </script>
</body>
</html>
